# Responsibilities: 在现有 HTTPS 虚拟主机中新增 /prs 路径，其他路由保持原装配。
# Implementation: 剥离 /prs/ 后转发到独立回环端口；不缓冲 WebSocket，不重试上游。
# Related Modules: prs-camera.service, config.camera_server；由原 443 server include。
# Declaration Index: None。
# Variable Index: $host/$scheme 为 Nginx 校验的主机/协议；$http_upgrade 为协议升级请求。
location = /prs {
    return 308 /prs/;
}
location = /prs/admin {
    return 404;
}
location ^~ /prs/admin/ {
    return 404;
}
location ^~ /prs/ {
    proxy_pass http://127.0.0.1:8766/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 1m;
    access_log /var/log/nginx/prs-camera.access.log combined;
    error_log /var/log/nginx/prs-camera.error.log warn;
}

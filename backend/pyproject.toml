# Responsibilities: Configure backend Ruff checks.
# Implementation: Check Python 3.12 syntax and import ordering; define no business parameters.
# Related Modules: requirements-dev.txt, .github/workflows/backend.yml。
# Declaration Index: None。
# Variable Index: tool.ruff.line-length — line width; target-version — Python version;
# tool.ruff.lint.select — enabled rule set.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Responsibilities: 后端 Ruff 检查配置。
# Implementation: Python 3.12 语法检查及导入排序；不定义业务参数。
# Related Modules: requirements-dev.txt, .github/workflows/backend.yml。
# Declaration Index: None。
# Variable Index: tool.ruff.line-length 为行宽；target-version 为 Python 版本；
# tool.ruff.lint.select 为启用的规则集合。
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Responsibilities: Relay only the two public Phone MVP pages and their required internal paths.
# Implementation: Existing trusted TLS server includes this file; reject bare mount paths, strip
# /mvp once, preserve public Host/Origin, disable buffering/retries, and keep PRS independent.
# Related Modules: integration.mobile/relay; tools.run_phone_mvp; integration.phone_deploy.
# Declaration Index: None.
# Variable Index: $host/$scheme are proxy-owned authority; $http_upgrade controls WS upgrade;
# 18766 is server loopback only, never a public Web/GPU listener; the application enforces its path allowlist.
location = /mvp {
    return 404;
}
location = /mvp/ {
    return 404;
}
location = /mvp/mcp { return 404; }
location = /mvp/mcp/ { return 404; }
location = /mvp/admin { return 404; }
location ^~ /mvp/admin/ { return 404; }
location ^~ /mvp/api/ { return 404; }
location ^~ /mvp/ {
    proxy_pass http://127.0.0.1:18766/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-PRS-Relay "1";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    client_max_body_size 2m;
    access_log /var/log/nginx/prs-phone-relay.access.log combined;
    error_log /var/log/nginx/prs-phone-relay.error.log warn;
}

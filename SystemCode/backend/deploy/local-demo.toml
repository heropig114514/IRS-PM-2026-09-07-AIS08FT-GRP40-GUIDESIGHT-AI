# Responsibilities: Share explicit local comparison profiles and trusted checkpoint sources.
# Implementation: Fixed Torch/TensorRT choices; camera window changes preserve codec and cadence.
# Related Modules: tools/local_demo.py; LOCAL-QUICKSTART.md; models/yolo26n.json.
# Declaration Index: None.
# Variable Index: profiles select depth backend/fusion and camera admission; models bind source hashes.

[profiles.baseline]
backend = "torch"
fusion = "gpu"
camera = "standard"

[profiles.low-latency]
backend = "torch"
fusion = "host"
camera = "bounded-2"

[profiles.tensorrt]
backend = "tensorrt"
fusion = "host"
camera = "bounded-2"


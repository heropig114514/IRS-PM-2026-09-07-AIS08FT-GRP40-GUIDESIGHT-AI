# Responsibilities: Add the /prs path to the existing HTTPS virtual host while preserving other route configuration.
# Implementation: Strip /prs/ before proxying; video WebSocket timeout 65 s, MCP 70 s, scene description 45 s/2m, and others 30 s/1m; no retries.
# Related Modules: prs-camera.service, config.camera_server, core.scene; included by the existing 443 server.
# Declaration Index: None.
# Variable Index: $host/$scheme — host/protocol validated by Nginx; $http_upgrade — protocol-upgrade request.
# proxy_read_timeout — MCP 70 s/video 65 s/scene description 45 s/others 30 s; proxy_next_upstream — retries explicitly disabled.
location = /prs {
    return 308 /prs/;
}
location = /prs/admin {
    return 404;
}
location ^~ /prs/admin/ {
    return 404;
}
# MCP UI observations may run for up to60s; preserve explicit tool completion/error responses.
location = /prs/mcp {
    proxy_pass http://127.0.0.1:8766/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_read_timeout 70s;
    proxy_send_timeout 30s;
    client_max_body_size 1m;
}
location = /prs/mcp/ {
    return 308 /prs/mcp;
}
# The phone uses one same-origin binary WS; allow the approved55s first-frame wait.
# Subsequent frames are bounded by the application's10s receive budget; no GPU auto-restart.
location = /prs/ws/detect/hf/ {
    proxy_pass http://127.0.0.1:8766/ws/detect/hf/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_read_timeout 65s;
    proxy_send_timeout 30s;
    client_max_body_size 1m;
    access_log /var/log/nginx/prs-camera.access.log combined;
    error_log /var/log/nginx/prs-camera.error.log warn;
}
# Scene description carries a base64 JPEG (up to ~1.4 MiB) that exceeds the 1m limit of /prs/;
# the app enforces 1.5 MiB. Upstream I/O timeout is 20s per operation, so allow 45s; no retries.
location ^~ /prs/scene/ {
    proxy_pass http://127.0.0.1:8766/scene/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_read_timeout 45s;
    proxy_send_timeout 30s;
    client_max_body_size 2m;
    access_log /var/log/nginx/prs-camera.access.log combined;
    error_log /var/log/nginx/prs-camera.error.log warn;
}
location ^~ /prs/ {
    proxy_pass http://127.0.0.1:8766/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 1m;
    access_log /var/log/nginx/prs-camera.access.log combined;
    error_log /var/log/nginx/prs-camera.error.log warn;
}

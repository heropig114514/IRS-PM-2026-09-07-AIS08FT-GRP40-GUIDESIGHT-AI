# Responsibilities: Run dependency, Django, branch-coverage, protocol, and Ruff checks for backend and frontend.
# Implementation: Ubuntu/Python 3.12/Node 22; unit tests use fixtures, not public network or downloaded models.
# Related Modules: SystemCode/clips/backend/core/tests.py/test_echo.py/test_maps.py/test_ai_control.py;
# SystemCode/clips/frontend/tests/*.test.mjs, SystemCode/clips/frontend/ai-control.js, SystemCode/clips/backend/pyproject.toml.
# Declaration Index: None.
# Variable Index: DJANGO_SECRET_KEY — ephemeral CI configuration; backend coverage fails below 85%;
# frontend coverage fails below 85% lines, 80% branches, or 80% functions.
name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SystemCode/clips/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: SystemCode/clips/backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate temporary CI configuration
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(48) + '\n')
          PY
      - name: Check dependencies
        run: python -m pip check
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Test backend with branch coverage
        run: python -m coverage run manage.py test
      - name: Enforce backend code coverage
        run: python -m coverage report
      - name: Lint backend
        run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test frontend with code coverage gates
        working-directory: SystemCode/clips/frontend
        run: npm run test:coverage
      - name: Check frontend syntax
        working-directory: SystemCode/clips/frontend
        run: |
          node --check camera.js
          node --check echo-client.js
          node --check live-detection-client.js
          node --check ai-control.js
          node --check maps-client.js
          node --check maps-page.js

# Responsibilities: 后端框架的依赖、Django、测试和 Ruff 自动检查。
# Implementation: Ubuntu/Python 3.12；生成当次 CI 的临时密钥，使用测试数据库。
# Related Modules: backend/requirements-dev.txt, backend/core/tests.py。
# Declaration Index: None。
# Variable Index: DJANGO_SECRET_KEY — GITHUB_ENV 中仅供当次运行的随机配置。
name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate temporary CI configuration
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(48) + '\n')
          PY
      - name: Check dependencies
        run: python -m pip check
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Test backend
        run: python manage.py test
      - name: Lint backend
        run: ruff check .

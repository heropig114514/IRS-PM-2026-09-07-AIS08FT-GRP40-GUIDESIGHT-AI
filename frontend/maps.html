<!doctype html>
<!-- Responsibilities: Google Maps 设备定位测试界面。
Implementation: 主动点击定位；呈现精度和地图状态；nonce 由 core.maps 每次响应替换。
Related Modules: maps-page.js, maps-client.js, camera.css, core.maps。
Declaration Index: None。
Variable Index: __CSP_NONCE__ — 服务端 CSP 占位符；id 供地图控制器引用。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRS · Google Maps 定位</title>
    <link rel="stylesheet" href="../assets/camera.css" />
    <style nonce="__CSP_NONCE__">
      #map {
        height: 440px;
        width: 100%;
        background: #e7edf2;
      }
      .location-details {
        padding: 20px;
        line-height: 1.8;
        overflow-wrap: anywhere;
      }
      .map-controls {
        padding: 20px;
      }
      @media (max-width: 700px) {
        #map {
          height: 360px;
        }
      }
    </style>
    <script
      nonce="__CSP_NONCE__"
      type="module"
      src="../assets/maps-page.js"
    ></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="../"
          ><span class="brand-mark">P</span> PRS LAB</a
        >
        <a class="top-note" href="../">← 摄像头回传</a>
      </header>
      <main>
        <section class="intro">
          <p class="eyebrow">GOOGLE MAPS · 02</p>
          <h1>在地图上，<br /><span>找到此刻的位置。</span></h1>
          <p class="subtitle">
            使用这台设备的位置。点击后浏览器会请求定位权限。
          </p>
        </section>
        <section class="workspace" aria-label="地图定位测试">
          <div class="workspace-header">
            <strong>设备定位</strong
            ><span id="maps-status" class="status" role="status"
              >检查配置中</span
            >
          </div>
          <div id="map" aria-label="Google 地图"></div>
          <div class="map-controls">
            <button id="locate" class="primary" disabled>显示我的位置</button>
          </div>
          <p id="maps-message" class="location-details" role="status">
            正在检查 Google Maps 配置。
          </p>
          <div class="location-details">
            纬度：<span id="latitude">—</span> · 经度：<span id="longitude"
              >—</span
            ><br />定位精度：<span id="accuracy">—</span>
          </div>
        </section>
      </main>
      <footer>
        坐标只用于此页面和 Google 地图显示，PRS 服务端不接收或保存位置。
      </footer>
    </div>
  </body>
</html>
